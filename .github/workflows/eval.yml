name: Save hand-check source text

on:
  workflow_dispatch:       # run by hand from the Actions tab

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python eval/source_text.py      # no Adzuna key here: archive only, no API calls
      - run: |
          git config user.name "daily-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/hand_check_text.json
          git diff --cached --quiet && exit 0
          git commit -m "eval: source text of the 50 hand-check posts"
          git pull --rebase origin main
          git push
