# The whole "backend": runs the pipeline every morning, commits the fresh
# data back into the repo, then deploys the site to GitHub Pages.
name: Daily refresh

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, every day
  workflow_dispatch:       # "Run workflow" button, for manual refreshes
  push:
    branches: [main]
    paths: ["site/**"]     # editing only the website redeploys without re-fetching

concurrency:
  group: daily-refresh     # never let two runs write data at the same time
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # needed to commit the new data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, filter, dedupe, tag, publish
        run: python pipeline/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID || secrets.APPLICATION_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || secrets.APPLICATION_KEYS }}
      - name: Commit the new data
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: daily refresh $(TZ=Asia/Kolkata date +'%d %b %Y')"
          git pull --rebase origin main   # in case code was pushed while we ran
          git push

  deploy:
    needs: refresh
    # run after a refresh, or straight away when only the site changed
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # pick up the data commit made by the refresh job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
